services:
  - type: web
    name: speed-recap
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data/speed-recap
      - key: MAX_UPLOAD_MB
        value: "900"
      - key: GEMINI_API_KEY
        sync: false